<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Typomatic 3000</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://pixels.crd.co/assets/images/gallery02/18f9b089.gif?v=29416114">
</head>
<body>
   <div>
        <h2 id="title"><img src="https://pixelsafari.neocities.org/favicon/food/produce/apple5.gif" style="width: 60px; position: relative; top: 10px"> Apple Typomatic 3000</h2>
        <div class="outer-wrap">
            <div class="main-game-box">
                <div class="info-box">
                    <ul class="info">
                        <li id="time"> Time: <span style="text-decoration: wavy; font-weight: bold;"> 60s</span></li>
                        <li id="Errors">Errors: <span>0</span></li>
                        <li id="wpm">WPM: <span>0</span></li>
                    </ul>
                    <button id="restart">Restart</button>
                </div>
                <input class="player">
                <div id="word-part">
                    <p id="words">Hi! welcome to the Apple Typomatic 3000!! This is a typing game simliar to monkey type made to <span style="text-decoration: line-through pink 1px;">force you</span> <span style="font-weight: bold; color: #d87093; ">help</span> you to get better and faster at typing. Click the "Restart" button to generate your paragraph that may or may not make sense :) </p>
                 </div>
            </div>
        </div>
    </div>
    </div>
   </div> 
   <div class="fruit">
    <div class="apple"></div>
   </div>
   <script src="text.js"></script>
</body>
</html>
